name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # windows runner: the package imports pywin32/pythoncom at module level
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit
      - name: Run tests under coverage
        run: coverage run --source=solidworks_mcp -m pytest -q
      - name: Enforce coverage gate (>=80%)
        run: coverage report --fail-under=80
      - name: Audit dependencies for known CVEs
        run: pip-audit --skip-editable
